[package]
name = "whelm-sim"
version = "0.1.0"
authors = ["Joey Beauvais-Feisthauer <joeybf@wayne.edu>"]
edition = "2024"
description = "Trace replay and whole-run simulation of Nassau scheduling against the `whelm` policies"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: not a member of the `ext` workspace, so it builds, locks and tests on its own.
[workspace]

[dependencies]
whelm = { path = "../whelm", features = ["log"] }

clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "whelm-sim"
path = "src/bin/whelm_sim.rs"

[[bin]]
name = "whelm-whole"
path = "src/bin/whelm_whole.rs"

[[bin]]
name = "whelm-device"
path = "src/bin/whelm_device.rs"

[[bin]]
name = "whelm-pisa"
path = "src/bin/whelm_pisa.rs"
