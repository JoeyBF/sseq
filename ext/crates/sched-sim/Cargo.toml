[package]
name = "sched-sim"
version = "0.1.0"
authors = ["Joey Beauvais-Feisthauer <joeybf@wayne.edu>"]
edition = "2024"
description = "Trace replay and whole-run simulation of Nassau scheduling against the `sched` policies"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: not a member of the `ext` workspace, so it builds, locks and tests on its own.
[workspace]

[dependencies]
sched = { path = "../sched", features = ["log"] }

clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "sched-sim"
path = "src/bin/sched_sim.rs"

[[bin]]
name = "sched-whole"
path = "src/bin/sched_whole.rs"

[[bin]]
name = "sched-device"
path = "src/bin/sched_device.rs"

[[bin]]
name = "sched-pisa"
path = "src/bin/sched_pisa.rs"
