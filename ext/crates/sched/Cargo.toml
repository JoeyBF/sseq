[package]
name = "sched"
version = "0.1.0"
authors = ["Joey Beauvais-Feisthauer <joeybf@wayne.edu>"]
edition = "2024"
description = "Pure, deterministic, resource-aware job placement (priority, backfill, best-fit) with an optional dependency-DAG layer"
license = "MIT OR Apache-2.0"

# Standalone: not a member of the `ext` workspace, so it builds, locks and tests on its own.
[workspace]

[features]
default = ["serde"]
# Snapshot/reload of the declared DAG (`DagScheduler::snapshot` / `restore`).
serde = ["dep:serde", "petgraph/serde-1"]
# The JSONL event-log writer (`log::JsonlSink`).
log = ["serde", "dep:serde_json", "dep:flate2"]
# The trace simulator (`sched-sim` binary and the `sim` module).
sim = ["log", "dep:clap"]

[dependencies]
petgraph = { version = "0.8", default-features = false, features = ["stable_graph", "std"] }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.7.0"
serde_json = "1"

[[bin]]
name = "sched-sim"
path = "src/bin/sched_sim.rs"
required-features = ["sim"]

[[bin]]
name = "sched-whole"
path = "src/bin/sched_whole.rs"
required-features = ["sim"]

[[bin]]
name = "sched-device"
path = "src/bin/sched_device.rs"
required-features = ["sim"]

[[bin]]
name = "sched-pisa"
path = "src/bin/sched_pisa.rs"
required-features = ["sim"]
